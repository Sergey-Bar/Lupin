<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lupin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      The theme, chosen before the first paint.

      `ThemeProvider` sets `data-theme` in an effect, which runs after the first paint. A reader
      who saved the light theme (or whose system is light) therefore saw the dark default for a
      frame and then watched every element transition to light. This script reads the same stored
      value and writes the same attribute, synchronously, before the stylesheet is applied, so
      the page is painted once and in the right theme. `ThemeProvider` still owns the setting
      afterwards; this only removes the flash. The stored value is validated, not trusted, the
      way the provider validates it. `theme-boot.test.ts` runs this exact text.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('lupin-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : null;
          if (theme === null) {
            theme =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          // An OpenCode palette is a dark theme. Only a name made of letters and hyphens is
          // written, so a hand-edited value cannot inject anything; an unknown one matches no rule.
          // Default: Lupin's own palette (ThemeProvider's DEFAULT_PALETTE), so nothing is set.
          var palette = localStorage.getItem('lupin-palette') || 'lupin';
          if (palette && palette !== 'lupin' && /^[a-z-]+$/.test(palette)) {
            document.documentElement.setAttribute('data-palette', palette);
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (_) {
          /* Storage can be blocked; the provider sets the theme once it mounts. */
        }
      })();
    </script>
    <!--
      The two fonts, preloaded.

      `crossorigin` is required on a font preload even for a same-origin file,
      and its absence is the reason a preloaded font is fetched twice: the
      preload goes out in CORS mode and the `@font-face` request does not match
      it, so the browser keeps both — a second copy of a 90KB file on the
      critical path. These two attributes look redundant and are not.

      The `href`s are **relative to this file on purpose**, and that is a
      build-time fact rather than a convenience. The binaries live in one place
      (`packages/ui/src/assets/fonts/`) because the product and the
      documentation site both consume them, which means Vite — not this file —
      decides what URL each one gets. Writing a path by hand would pin a URL
      that no longer matches the `@font-face` it is meant to warm, and a preload
      whose URL does not match is a wasted request rather than a saved one.

      So the path is relative, Vite resolves it against `apps/web/`, and the
      built `dist/index.html` carries the same fingerprinted URL the compiled
      stylesheet does — verified, not assumed, and `fonts.test.ts` keeps the two
      lists in step on the source side.

      **In `pnpm dev` the two URLs differ** and the preload does not dedupe:
      Vite rewrites a `url()` in CSS to `/@fs/<absolute path>` while leaving
      `link[href]` alone, so the preload normalises to `/packages/ui/src/…` and
      the stylesheet asks for `/@fs/C:/…`. Both serve the same bytes — the dev
      server resolves the workspace root — so the cost is one extra uncached
      request in dev and nothing in production, which is the only place a
      preload earns its keep.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="../../packages/ui/src/assets/fonts/geist-var.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="../../packages/ui/src/assets/fonts/inter-display-semibold.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="../../packages/ui/src/assets/fonts/geist-mono-var.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
