name: Release

# Pushing a `v*` tag publishes a release: multi-arch images on ghcr.io, the downloadable
# bundle, and a GitHub release whose notes are that version's changelog section. The
# last job installs the release from the release page on a clean runner, the way a user
# would, and fails the run if it does not come up. See docs/operations/releasing.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# A tag is released once. A second push of the same ref waits rather than racing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.x
  IMAGE_PREFIX: ghcr.io/sergey-bar/lupin

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Refuses a tag that is not v<semver>, a package.json that names another version,
      # and a changelog with no section for it — before anything is built or published.
      - name: Release notes from the changelog
        run: node ./scripts/release-notes.mjs --tag "$GITHUB_REF_NAME" --out release-notes.md
      - name: Version and image tags
        id: meta
        run: |
          node --input-type=module -e "
            import { imageTags, parseTag } from './scripts/lib/release-notes.mjs';
            const tag = process.env.GITHUB_REF_NAME;
            const { version, prerelease } = parseTag(tag);
            console.log('version=' + version);
            console.log('prerelease=' + String(prerelease));
            console.log('tags=' + imageTags(tag).join(','));
          " >> "$GITHUB_OUTPUT"
      - name: Keep the notes for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  verify:
    name: Verify
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        # Full history: `pnpm verify` runs the secret scan over every commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install static-analysis scanners
        uses: ./.github/actions/install-scanners
      - name: Verify
        run: pnpm verify

  images:
    name: Image ${{ matrix.image }} (${{ matrix.platform.arch }})
    needs: [prepare, verify]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image:
          - migrate
          - api
          - worker
          - runner
          - web
          - edge
        # Native runners for each architecture, not QEMU: the runner image installs three
        # browsers with their system libraries, which under emulation takes most of an hour.
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Sign in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed by digest only. The merge job below gives the two architectures one tag.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          build-args: |
            LUPIN_VERSION=${{ needs.prepare.outputs.version }}
            LUPIN_REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      # Scanned by digest, before the merge job gives it a tag, so an image with a known,
      # fixable High or Critical vulnerability never becomes what `latest` pulls (plan
      # 1795712849115 task 7). `only-fixed`: a finding with no released fix cannot be acted
      # on by rebuilding, and failing on it would make every release red until upstream moves.
      - name: Scan for known vulnerabilities
        uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        with:
          image: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}@${{ steps.build.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Keep the digest for the merge
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: digests-${{ matrix.image }}-${{ matrix.platform.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifests:
    name: Publish ${{ matrix.image }}
    needs: [prepare, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        image:
          - migrate
          - api
          - worker
          - runner
          - web
          - edge
    steps:
      - name: Collect both architectures' digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: digests
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Sign in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `X.Y.Z` always; `X.Y` and `latest` only for a final release, so a candidate never
      # becomes what `latest` pulls.
      - name: Tag one multi-arch image
        id: merge
        working-directory: digests
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          count="$(ls | wc -l)"
          [ "$count" -eq 2 ] || { echo "expected 2 architecture digests, found $count"; exit 1; }
          args=()
          for tag in ${TAGS//,/ }; do args+=(-t "$IMAGE:$tag"); done
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest where and how it was built
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true
      # A keyless signature: the certificate names this workflow and this tag, issued through
      # the job's OIDC token, so there is no signing key to keep or leak. The acceptance job
      # verifies it the way a user would, before it installs anything.
      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Sign the image
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  visibility:
    name: Images are public
    needs: manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      # GHCR creates a package private on its first push and no token can change that.
      # A private image installs for its author and fails for everyone else, so this
      # stops the release and names the settings page for each one.
      - name: Pull every image without signing in
        run: node ./scripts/release-visibility.mjs --tag "$GITHUB_REF_NAME"

  release:
    name: GitHub release
    needs: [prepare, visibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          run_install: false
      - name: Fetch the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-notes
      - name: Build the bundle
        run: node ./scripts/release-bundle.mjs --version "${{ needs.prepare.outputs.version }}"
      # The CLI and the Playwright reporter as installable tarballs, until they are on npm:
      # `npx -p <release url>/lupin-cli-<version>.tgz lupin`. Packed by pnpm, so `workspace:`
      # and `catalog:` are rewritten exactly as a publish would.
      - name: Pack the CLI and the Playwright reporter
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @lupin/cli --filter @lupin/playwright-reporter build
          pnpm --filter @lupin/cli --filter @lupin/playwright-reporter exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist/release"
          (cd dist/release && sha256sum lupin-cli-*.tgz lupin-playwright-reporter-*.tgz >> SHA256SUMS)
      # A CycloneDX software bill of materials for the source tree the release was built
      # from: every npm package in `pnpm-lock.yaml`, with versions and licences. The
      # images already carry buildx's SBOM attestation; this is the one a user who
      # downloads the bundle, and never pulls an image, can read.
      - name: Software bill of materials
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/release/lupin-${{ needs.prepare.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          assets=("dist/release/lupin-${VERSION}.zip" "dist/release/SHA256SUMS" "dist/release/lupin-${VERSION}.cdx.json"
            "dist/release/lupin-cli-${VERSION}.tgz" "dist/release/lupin-playwright-reporter-${VERSION}.tgz")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            flags=()
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag --title "v${VERSION}" --notes-file release-notes.md "${flags[@]}"
          fi

  acceptance:
    name: Install from the release page
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # No checkout: this job has only what a user downloads.
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      # What a careful user runs before trusting an image: the signature must come from this
      # repository's release workflow, through GitHub's OIDC issuer. An unsigned image, or
      # one signed by anything else, stops the release here.
      - name: Verify every image's signature
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for image in migrate api worker runner web edge; do
            cosign verify "$IMAGE_PREFIX-$image:$VERSION" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "signed: $IMAGE_PREFIX-$image:$VERSION"
          done
      - name: Download the bundle and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            -p "lupin-${{ needs.prepare.outputs.version }}.zip" -p SHA256SUMS
          # SHA256SUMS also lists the CLI and reporter tarballs, which are not downloaded here.
          # The zip's line is required, so sums that omit it still fail.
          grep -qE "  lupin-${{ needs.prepare.outputs.version }}\.zip$" SHA256SUMS
          sha256sum -c SHA256SUMS --ignore-missing
          unzip -q "lupin-${{ needs.prepare.outputs.version }}.zip"
      - name: Start it
        working-directory: lupin-${{ needs.prepare.outputs.version }}
        env:
          LUPIN_NO_BROWSER: '1'
        run: ./start.sh
      - name: Probe it as a user
        working-directory: lupin-${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8080/api/v1/ready
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          key="$(sed -n 's/^LUPIN_INSTALLATION_KEY=//p' .env)"
          curl -fsS -o /dev/null -X POST -H 'content-type: application/json' \
            -d "{\"apiKey\":\"$key\"}" http://127.0.0.1:8080/api/v1/auth/login
      - name: Logs, if it failed
        if: failure()
        working-directory: lupin-${{ needs.prepare.outputs.version }}
        run: ./start.sh status; docker compose -p lupin --env-file .env -f compose.yml logs --no-color --tail 80
      - name: Remove it
        if: always()
        working-directory: lupin-${{ needs.prepare.outputs.version }}
        run: ./start.sh uninstall --purge
      # Recorded rather than implied. GitHub's Windows runners run Windows containers only,
      # and its macOS runners have no Docker, so neither can start these Linux images.
      # start.ps1 and start.cmd are covered by the "Start scripts on Windows" job instead.
      - name: What this job could not check
        if: always()
        run: |
          {
            echo '### Acceptance coverage'
            echo '- Linux amd64: installed from the release page, probed, removed.'
            echo '- GAP Windows: hosted runners run Windows containers only; start.ps1 is tested against a fake docker.'
            echo '- GAP macOS: hosted runners have no Docker.'
            echo '- GAP arm64: images are built and published natively; not installed here.'
          } >> "$GITHUB_STEP_SUMMARY"

  upgrade:
    name: Upgrade from ${{ matrix.from }}
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # What an existing user does: they have an earlier release running, with its own `.env` and
    # its own compose file, and run `start update`. This installs it, moves it to this release,
    # and checks the same sign-in key still works. It is the only place the migrations are
    # applied to a database an earlier release created.
    #
    # **Two starting points, because one is not enough.** `previous` is the latest final release
    # before this one. `3.0.0` is pinned: `update` keeps the old install's compose file and only
    # changes the image, so this is the one run that hands a current API the environment a
    # pre-LAN-mode compose file gives it (HOST=0.0.0.0, no LUPIN_BIND). With `previous`
    # alone, the 3.1.0 release shipped an API that refused to start on every 3.0.0 install,
    # and the next release would have stopped looking for it. When the pinned release is also
    # the previous one the second run skips itself rather than repeat the first.
    strategy:
      fail-fast: false
      matrix:
        from: [previous, '3.0.0']
    env:
      NEW_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Find the release to upgrade from
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ matrix.from }}
        run: |
          set -euo pipefail
          previous="$(gh release list -R "$GITHUB_REPOSITORY" --exclude-pre-releases --exclude-drafts \
            --limit 20 --json tagName --jq '.[].tagName' | grep -vx "$GITHUB_REF_NAME" | head -n 1 || true)"
          if [ "$FROM" = previous ]; then
            tag="$previous"
          elif [ "v$FROM" = "$previous" ]; then
            tag=""
            echo "$FROM is the previous release; the first run covers it." >> "$GITHUB_STEP_SUMMARY"
          else
            tag="v$FROM"
          fi
          # 4.0.0 renamed images, environment variables and bundles with no compatibility layer,
          # so a starting point from an earlier major line has no update path to exercise.
          NEW_MAJOR="${NEW_VERSION%%.*}"
          tag_major="${tag#v}"
          tag_major="${tag_major%%.*}"
          if [ -n "$tag" ] && [ "$tag_major" != "$NEW_MAJOR" ]; then
            echo "$tag is on an earlier major line than $NEW_VERSION; there is no update path from it." >> "$GITHUB_STEP_SUMMARY"
            tag=""
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          [ -n "$tag" ] || echo "Nothing to upgrade from for '$FROM'." >> "$GITHUB_STEP_SUMMARY"
      - name: Install the previous release
        if: steps.previous.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_VERSION: ${{ steps.previous.outputs.version }}
          LUPIN_NO_BROWSER: '1'
        run: |
          set -euo pipefail
          gh release download "v$OLD_VERSION" -R "$GITHUB_REPOSITORY" -p "lupin-$OLD_VERSION.zip" -p SHA256SUMS
          # A 5.x release also lists its CLI and reporter tarballs, not downloaded here.
          grep -qE "  lupin-$OLD_VERSION\.zip$" SHA256SUMS
          sha256sum -c SHA256SUMS --ignore-missing
          unzip -q "lupin-$OLD_VERSION.zip"
          cd "lupin-$OLD_VERSION"
          ./start.sh
      - name: Update it to this release
        if: steps.previous.outputs.version != ''
        env:
          OLD_VERSION: ${{ steps.previous.outputs.version }}
          LUPIN_NO_BROWSER: '1'
        run: |
          set -euo pipefail
          cd "lupin-$OLD_VERSION"
          ./start.sh update --version "$NEW_VERSION"
      - name: Probe the updated install
        if: steps.previous.outputs.version != ''
        env:
          OLD_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          set -euo pipefail
          cd "lupin-$OLD_VERSION"
          grep -qx "LUPIN_VERSION=$NEW_VERSION" .env
          curl -fsS http://127.0.0.1:8080/api/v1/ready
          key="$(sed -n 's/^LUPIN_INSTALLATION_KEY=//p' .env)"
          curl -fsS -o /dev/null -X POST -H 'content-type: application/json' \
            -d "{\"apiKey\":\"$key\"}" http://127.0.0.1:8080/api/v1/auth/login
          docker compose -p lupin --env-file .env -f compose.yml ps --format '{{.Image}}' \
            | grep -q "lupin-api:$NEW_VERSION"
      - name: Logs, if it failed
        if: failure() && steps.previous.outputs.version != ''
        env:
          OLD_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          cd "lupin-$OLD_VERSION"
          docker compose -p lupin --env-file .env -f compose.yml logs --no-color --tail 80
      - name: Remove it
        if: always() && steps.previous.outputs.version != ''
        env:
          OLD_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          cd "lupin-$OLD_VERSION"
          ./start.sh uninstall --purge
