name: Nightly Quality Gates

on:
  schedule:
    - cron: '0 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

# Without this, a manual run started while a scheduled run is in flight produces
# two overlapping runs, and whichever finishes last overwrites the conclusion
# read as the current one. `unified-ci.yml` had a concurrency block; this and
# `release-gate.yml` did not.
concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.x

jobs:
  security:
    name: Security and license audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        # Full history: the secret scan walks every commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      # `pnpm security:verify` runs `pnpm security:static`, which exits
      # not_configured — non-zero — when a scanner is missing. This job used to
      # have no install step, so it failed on its first step and never reached
      # the secret scan, licence check, duplication, complexity, or
      # capability-register steps behind it.
      - name: Install static-analysis scanners
        uses: ./.github/actions/install-scanners
      - name: Security and license verification
        run: pnpm security:verify

  smoke:
    name: Smoke and local-target guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # `smoke:local` and `smoke:rehearsal` existed and were wired into no workflow, no
    # `verify` and no `verify:release`. Tier `nightly` per plan D6.
    #
    # Two honest notes about what these two scripts are, because the names invite
    # more than they deliver:
    #
    #  - `smoke:rehearsal` runs `scripts/migration-rehearsal.mjs`, which is a
    #    **local-target guard**, not a rehearsal. It checks that the target is a
    #    loopback database and refuses to authorize a cutover; its own report says
    #    `rehearsalPerformed: false` and lists the phases as `plannedPhases`. The
    #    rehearsal harness the plan's W6 gate needs does not exist yet. The job is
    #    named for the guard, because a job called "Migration rehearsal" over a
    #    guard is a claim the report contradicts.
    #  - `smoke:local` needs a running stack, so this job brings one up against real
    #    PostgreSQL rather than asserting readiness of nothing.
    #
    # `continue-on-error` because this job has never run in CI and a first run that
    # turns the whole nightly red is how a gate gets switched off. It reports; the
    # # next review decides whether it blocks.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: lupin
          POSTGRES_DB: lupin
          # `trust`, not a password. The service port is bound to the runner only.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lupin -d lupin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lupin@127.0.0.1:5432/lupin
      # The guard's own precondition. It refuses anything that is not loopback, which
      # is why it can run in CI at all: the service is published on 127.0.0.1.
      REHEARSAL_MODE: local
      PERF_READY_FILE: var/smoke-api.ready
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the workspace
        run: pnpm build
      # The same supervisor the performance gate uses: it applies the real migration
      # graph, starts the API on the Drizzle path, and reports readiness through a
      # file so "still migrating" is distinguishable from "failed to migrate".
      - name: Start the API against PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          node ./scripts/performance-server.mjs &
          for attempt in $(seq 1 120); do
            if [ -f var/smoke-api.ready ]; then
              cat var/smoke-api.ready
              if grep -q '^ready ' var/smoke-api.ready; then exit 0; fi
              echo "the API reported a failure while starting" >&2
              exit 1
            fi
            sleep 1
          done
          echo "the API never reported readiness in 120s" >&2
          exit 1
      - name: Start the web client
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @lupin/unified-web exec vite --host 127.0.0.1 --port 5173 &
          for attempt in $(seq 1 120); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:5173/ > /dev/null; then
              echo "web ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "the web client never came up in 120s" >&2
          exit 1
      - name: Local smoke
        run: pnpm smoke:local --json | tee var/smoke-local.json
      - name: Local-target guard
        run: pnpm smoke:rehearsal
      - name: Stop the stack
        if: always()
        shell: bash
        run: pkill -f "scripts/performance-server.mjs" || true
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: smoke-evidence
          path: |
            var/smoke-local.json
            var/smoke-api.ready
            var/migration-rehearsal/
          if-no-files-found: ignore
          retention-days: 30

  # Backup and restore, driven the way a user drives them (plan 1795712849115 task 7). The
  # start scripts' own suite runs against a fake docker, so until this job nothing had ever
  # restored a real backup in CI. It installs the latest published release from its release
  # page, writes a row, backs up, writes a second row, restores, and checks the first row is
  # back and the second is gone. The artifacts' digests are checked by `restore` itself, against
  # the SHA256SUMS the backup wrote, before it replaces anything. No checkout:
  # like the acceptance job, it has only what a user downloads.
  restore-drill:
    name: Backup and restore drill
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      LUPIN_NO_BROWSER: '1'
    steps:
      - name: Install the latest release
        run: |
          set -euo pipefail
          tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          version="${tag#v}"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "lupin-$version.zip" -p SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          unzip -q "lupin-$version.zip"
          mv "lupin-$version" lupin
          cd lupin && ./start.sh
      - name: Write a row, back up, write another
        working-directory: lupin
        run: |
          set -euo pipefail
          key="$(sed -n 's/^LUPIN_INSTALLATION_KEY=//p' .env)"
          api() { curl -fsS -b jar -c jar -H 'content-type: application/json' "$@"; }
          api -X POST -d "{\"apiKey\":\"$key\"}" http://127.0.0.1:8080/api/v1/auth/login > /dev/null
          api -X POST -d '{"name":"drill-before","passRateThreshold":90}' \
            http://127.0.0.1:8080/api/v1/dashboard/quality-gates > /dev/null
          ./start.sh backup
          api -X POST -d '{"name":"drill-after","passRateThreshold":90}' \
            http://127.0.0.1:8080/api/v1/dashboard/quality-gates > /dev/null
      - name: Restore it
        working-directory: lupin
        run: ./start.sh restore "$(ls -d backups/lupin-* | tail -n 1)"
      - name: The backup came back, and only the backup
        working-directory: lupin
        run: |
          set -euo pipefail
          key="$(sed -n 's/^LUPIN_INSTALLATION_KEY=//p' .env)"
          curl -fsS -c jar -H 'content-type: application/json' -d "{\"apiKey\":\"$key\"}" \
            http://127.0.0.1:8080/api/v1/auth/login > /dev/null
          gates="$(curl -fsS -b jar http://127.0.0.1:8080/api/v1/dashboard/quality-gates)"
          echo "$gates" | grep -q '"drill-before"' || { echo "the row written before the backup is missing"; exit 1; }
          if echo "$gates" | grep -q '"drill-after"'; then echo "a row written after the backup survived the restore"; exit 1; fi
          echo "Restored: the gate written before the backup is back, and the later one is gone." >> "$GITHUB_STEP_SUMMARY"
      - name: Logs, if it failed
        if: failure()
        working-directory: lupin
        run: ./start.sh status; docker compose -p lupin --env-file .env -f compose.yml logs --no-color --tail 80
      - name: Remove it
        if: always()
        working-directory: lupin
        run: ./start.sh uninstall --purge || true

  quality-baseline:
    name: Quality baseline
    runs-on: ubuntu-24.04
    # 60, not 30. The job runs the suite twice: `pnpm test` for the per-package coverage the
    # ratchet reads, then the root Vitest run the aggregate counts tests from. On 2026-10-28
    # the first took 18 minutes and the second was still running when 30 minutes cancelled
    # the job, which is how the three nightlies from 2026-10-27 reported nothing at all
    # (MNT-153). The last green run took 18 minutes in total, on a smaller suite.
    timeout-minutes: 60
    # `quality:baseline` existed and was wired nowhere. It is the aggregate the
    # weekly numbers in `docs/quality/` come from, so running it nightly is what
    # makes those numbers a measurement rather than a transcription. Tier `nightly`
    # per plan D6 — it reports, it does not block.
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install static-analysis scanners
        uses: ./.github/actions/install-scanners
      # The aggregate reads what these two steps produce, in the order `verify` runs
      # them. Without the build, the root Vitest run resolves workspace packages to
      # `dist/` entries that do not exist and 172 suites fail to load; without the
      # per-package `pnpm test`, no `coverage/coverage-summary.json` exists and
      # `coverage:ratchet` fails on a missing input. Every nightly from 2026-10-13 to
      # 2026-10-21 reported both as failures of the product rather than of the job.
      - name: Build the workspace
        run: pnpm build
      - name: Per-package tests and coverage
        run: pnpm test
      - name: Quality baseline
        run: pnpm quality:baseline
      - name: Upload the quality report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quality-report
          # `error`, not `ignore` (ledger MNT-201): with no report the job fails and the run
          # shows it, instead of uploading nothing. The job is continue-on-error, so it is
          # reported, not blocking.
          path: |
            var/quality-baseline.json
            var/quality-*
          if-no-files-found: error
          retention-days: 30

  mutation:
    name: Mutation testing
    runs-on: ubuntu-24.04
    # Five packages, one Stryker run each, `coverageAnalysis: perTest`. 150, not 90: on the
    # two-core runner the five took 82 and 85 minutes on 2026-10-28, `reporting` alone about
    # 70 of them (5,642 mutants), and a third run was cancelled at 90 minutes with `reporting`
    # 94% done, so its report and the ratchet never ran (MNT-154). 150 leaves the room the
    # suite's growth needs without letting a hung Vitest worker hold the runner for 6 hours.
    timeout-minutes: 150
    # `continue-on-error` until this job has run once on a GitHub runner: the floors in
    # `docs/quality/mutation-baseline.json` were measured on Windows, and a first run that
    # turns the whole nightly red for a platform difference is how a gate gets switched off.
    # Graduating is one commit: read the first run's job summary, lower nothing, record
    # with `pnpm mutation:ratchet --record` if the numbers differ upward, and delete this line.
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Two commits: the ratchet compares the recorded floors with HEAD~1's.
          fetch-depth: 2
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      # The packages import `@lupin/shared-contracts` through `dist/`. Unbuilt, those test
      # files fail to load and Stryker reports their mutants as NoCoverage instead of failing:
      # a score that quietly measures less than the suite. `pnpm mutation` refuses to start
      # without the build for the same reason.
      - name: Build the workspace
        run: pnpm build
      - name: Mutation testing
        run: pnpm mutation
      - name: Mutation ratchet
        run: pnpm mutation:ratchet
      - name: Upload the mutation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutation-reports
          path: packages/*/reports/mutation/mutation.json
          if-no-files-found: ignore
          retention-days: 30

  performance:
    name: Performance thresholds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Tier 2 by design. `pnpm test:performance` was wired into no workflow, no
    # `verify`, and no `verify:release`, so the published thresholds had never
    # been executed by anything. Nightly is where a measurement belongs until
    # the baseline in tests/performance/thresholds.json is recorded and the numbers
    # are trustworthy enough to block a pull request.
    services:
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: lupin
          POSTGRES_DB: lupin
          # `trust`, not a password. The service port is bound to the runner
          # only, and a password here would be a credential committed to the
          # repository — which `pnpm security:secrets` refuses, correctly.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lupin -d lupin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lupin@127.0.0.1:5432/lupin
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install k6
        uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece
      - name: Build the workspace
        run: pnpm build
      - name: Migrate and start the API against PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          node ./scripts/performance-server.mjs &
          # The script reports readiness in a file rather than a log line, so a
          # migration failure is distinguishable from a slow start instead of
          # both looking like a 60-second timeout.
          for attempt in $(seq 1 120); do
            if [ -f var/performance-api.ready ]; then
              cat var/performance-api.ready
              if grep -q '^ready ' var/performance-api.ready; then exit 0; fi
              echo "the API never became ready" >&2
              exit 1
            fi
            sleep 1
          done
          echo "the API never reported readiness in 120s" >&2
          exit 1
      - name: Performance thresholds
        run: pnpm test:performance
        env:
          PERF_BASE_URL: http://127.0.0.1:3000
      - name: Upload performance summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: performance-summary
          path: var/performance-summary.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Stop the API
        if: always()
        shell: bash
        run: pkill -f "scripts/performance-server.mjs" || true

  dogfood:
    name: Lupin grades Lupin
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Boots the production stack in this job, runs three of this repository's suites through
    # the packed `lupin test`, sends its agent configuration and asks the gate, then reads the
    # grade and the release verdict back. With LUPIN_DOGFOOD_URL set (the reference install),
    # the same uploads go there instead and the history is kept. `pnpm dogfood`.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the workspace
        run: pnpm build
      - name: Lupin grades Lupin
        env:
          LUPIN_DOGFOOD_URL: ${{ vars.LUPIN_DOGFOOD_URL }}
          LUPIN_DOGFOOD_KEY: ${{ secrets.LUPIN_DOGFOOD_KEY }}
        run: pnpm dogfood
